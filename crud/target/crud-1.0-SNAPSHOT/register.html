<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Register</title>
  <link rel='stylesheet' href='main.css'>

  <style>
    #form{
            margin-top: 2vh;
            display: flex; 
            align-items: center;
            justify-content: end;
            flex-direction: column;
            
        }
  </style>
</head>

<body>
  <div id="form">
    <form id="form_register">
      <label for="username">Username:</label>
      <input required name="username" type="text" class="username"><br>
      <label for="displayname">Display Name:</label>
      <input required name="displayname" type="text" class="displayname"><br>
      <label for="email">E-mail:</label>
      <input required name="email" type="email" class="email"><br>
      <label for="password">Password:</label>
      <input required name="password" type="password" class="password"><br>
      <label for="confPass">Confirm Password:</label>
      <input required name="confPass" type="password"><br>
      <input type="submit" value="Submit">

    </form>
  </div>
  <script src="main.js"></script>

  <script>

    document.querySelector('#form_register').addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;

      const password = form.elements['password'].value;
      const confPass = form.elements['confPass'].value;

      if (password !== confPass) {
        alert("Passwords do not match.");
        return;
      }

      const params = {
        username: form.elements['username'].value.trim(),
        displayname: form.elements['displayname'].value.trim(),
        email: form.elements['email'].value.trim(),
        password: password
      };

      try {
        const url = "api/user";
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(params) });

        if (res.ok) {
          const error = await res.text();
          window.location.href = "login.html";

        } else {
          alert("Error creating the account");
        }

      } catch (error) {
        alert('Unable to connect to the server.');
        console.error(error);
      }
    });


  </script>
</body>

</html>
