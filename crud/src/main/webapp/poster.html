<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Title - Display Name</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel='stylesheet' href='main.css'>
    <style>

        body {
            overflow: hidden;
            display: flex;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        p {
            margin-bottom: 1vh;
        }

        #poster_section {
            background-color: bisque;
            position: relative;
            width: 50vw;
            height: 100vh;
            overflow-y: scroll;
            display: flex;
            flex-direction: row;
        }

        #cont_posters {
            background-color: bisque;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            width: 45vw;
            height: auto;
        }

         .poster {
            width: 40vw;
            height: auto;
            margin: 4vh 0;

        }

         #dots_cont{
            height: 80vh;
            width:2vw;
            display:flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .dot{
            margin: 0.5vw;
            width:1vw;
            height:1vw;
            background-color: blueviolet;
            border-radius: 2vw;
        }

        h2 {
            margin: 0;
        }

        aside {
            margin-left: 2vw;
            width: 50vw;
            height: 90%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #infoUser {
            width: 30vw;
            height: 10vh;
            display: flex;
            flex-direction: column;
        }

        #infoPoster {
            width: 30vw;
            height: auto;
        }

        #infoAdd {
            margin-top: 2vh;
            width: 30vw;
            height: auto;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            text-align: baseline;
        }

        nav {
            position: absolute;
            top: 2vh;
            right: 2vw;
        }

        .spacer {
            height: 2vh;
        }

       

    </style>
</head>

<body>
    <section id="poster_section">
        <div id="cont_posters">
            <div class="indv_posters"><img class="poster" src="posters/01_username.jpeg"></div>
        </div>
        <div id="dots_cont">
            <div class="dot" href=""></div>
        </div>
    </section>
    <aside>
        <div id="infoUser">
            <h2 id="name" value="name">nome</h2>
            <a id="username" href="profile.html">username</a>
        </div>
        <div class="spacer"></div>
        <div id="infoPost">
            <h2 id="title">title</h2>
            <p id="description">description</p>
            <a id="link" href=""> link</a>
        </div>
        <div id="infoAdd">
            <p id="location">location</p>
            <p id="year">year</p>
        </div>
        <nav>
            <a id="addPost" href="createPoster.html"> + </a>
            <a id="profile" href="profile.html"> profile </a>
        </nav>
        
    </aside>

<script src="main.js"></script>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
